# Provisioning state. Runbook: ../docs/provisioning.md
#
# status: pending | in_progress | done | blocked | not_applicable
# Items with `blocking:` list the build-plan gates they hold up. The release workflow
# refuses to submit to a store while a blocking item for that store is not `done`.


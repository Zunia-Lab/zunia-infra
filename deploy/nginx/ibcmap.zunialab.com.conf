# Zunia Map Zone (zunia-mapzone on 127.0.0.1:3017).

# Open live streams counted per visitor. Behind Cloudflare the socket's peer is
# a Cloudflare edge shared by many visitors, so the key is the client address
# Cloudflare forwards.
limit_conn_zone $http_cf_connecting_ip zone=mapzone_stream:10m;

server {
    listen 80;
    listen [::]:80;
    server_name ibcmap.zunialab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ibcmap.zunialab.com;

    ssl_certificate     /etc/letsencrypt/live/zunialab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zunialab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Server-Sent Events: never buffered. The app pings every 15 s, so a minute
    # of silence means the upstream is gone; a client that takes nothing for a
    # minute is cut, and the app sheds such viewers too.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        send_timeout 60s;
        # A few tabs per visitor, so one host cannot hold all 800 stream slots.
        limit_conn mapzone_stream 10;
        limit_conn_status 429;
    }
}

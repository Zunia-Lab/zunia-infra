# The web app's first address. Since dashboard v2 the app lives on
# app.zunialab.com; every request here takes one hop there, path and query
# kept, so old links, bookmarks and posts still land on the right page.
#
# Browsers keep a 301 forever unless told otherwise. For the first week the
# redirect is cacheable for one hour only, so it can still be changed; drop
# the add_header lines once the move has settled.
server {
    listen 80;
    listen [::]:80;
    server_name wallet.zunialab.com;
    add_header Cache-Control "max-age=3600" always;
    return 301 https://app.zunialab.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallet.zunialab.com;

    ssl_certificate     /etc/letsencrypt/live/zunialab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zunialab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Cache-Control "max-age=3600" always;
    return 301 https://app.zunialab.com$request_uri;
}

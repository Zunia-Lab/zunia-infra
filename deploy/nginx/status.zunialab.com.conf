server {
    listen 80;
    listen [::]:80;
    server_name status.zunialab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.zunialab.com;

    ssl_certificate     /etc/letsencrypt/live/zunialab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zunialab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uptime Kuma. The public hostname is mapped to the status page.
    # The admin UI stays on 127.0.0.1:3015. Push heartbeats also stay local.
    location ~ ^/(dashboard|setup|manage-status-page|settings)(/|$) {
        return 404;
    }

    location /api/push/ {
        return 404;
    }

    # Browser tab icon. Kuma's index.html points at /icon.svg, and its
    # favicon badge draws that image onto a canvas. The website SVG carries
    # a C2PA blob and a mask, which the canvas (and some browsers) will not
    # paint, so the tab stays blank. These files are a plain mark.
    location = /icon.svg {
        alias /srv/zunia/shared/status-brand/favicon.svg;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=300";
    }

    location = /favicon-32.png {
        alias /srv/zunia/shared/status-brand/favicon-32.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=300";
    }

    location = /apple-touch-icon.png {
        alias /srv/zunia/shared/status-brand/apple-touch-icon.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=300";
    }

    location = /favicon.ico {
        alias /srv/zunia/shared/status-brand/favicon.ico;
        default_type image/x-icon;
        add_header Cache-Control "public, max-age=300";
    }

    location = /brand/zunia-logo.png {
        alias /srv/zunia/shared/status-brand/zunia-logo.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Uncompressed HTML so the icon link below can be rewritten.
        # Favico.js badges whatever this link points at; an SVG source
        # draws as a blank tab icon.
        proxy_set_header Accept-Encoding "";
        sub_filter "<link rel=\"icon\" type=\"image/svg+xml\" href=\"/icon.svg\">" "<link rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"/favicon-32.png\">";
        sub_filter_once on;
        proxy_read_timeout 3600s;
    }
}

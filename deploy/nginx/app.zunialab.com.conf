# The web app (zunia-dashboard). Its canonical host since dashboard v2;
# wallet.zunialab.com and dashboard.zunialab.com send visitors here.
#
# The dashboard depends on two of these headers: `Host` for its same-origin
# guard on signing and push routes, and `X-Real-IP` (always replaced by the
# TCP peer, never the client's copy) for its rate limiter.
server {
    listen 80;
    listen [::]:80;
    server_name app.zunialab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.zunialab.com;

    ssl_certificate     /etc/letsencrypt/live/zunialab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zunialab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

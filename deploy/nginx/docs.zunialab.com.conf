server {
    listen 80;
    listen [::]:80;
    server_name docs.zunialab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.zunialab.com;

    ssl_certificate     /etc/letsencrypt/live/zunialab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zunialab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/zunia/repos/zunia-docs/build;
    index index.html;

    # Addresses the marketing site used to publish, before the /docs prefix.
    # And the old docs pages, which Docusaurus still answers as a 200 with a
    # script redirect. A real 301 is what a crawler can follow.
    location ^~ /chain-registry/overview { return 301 https://docs.zunialab.com/docs/chain-registry/overview/; }
    location ^~ /connect/sdk { return 301 https://docs.zunialab.com/docs/integrate/extension/; }
    location ^~ /wallet/keys-and-accounts { return 301 https://docs.zunialab.com/docs/use-wallet/keys/; }
    location ^~ /wallet/fees { return 301 https://docs.zunialab.com/docs/use-wallet/networks/; }
    location ^~ /wallet/custom-chains { return 301 https://docs.zunialab.com/docs/use-wallet/networks/; }
    location ^~ /developers/reproducible-builds { return 301 https://docs.zunialab.com/docs/developers/reproducible-builds/; }

    location ^~ /docs/getting-started/install-extension { return 301 https://docs.zunialab.com/docs/use-wallet/extension/; }
    location ^~ /docs/getting-started/install-mobile { return 301 https://docs.zunialab.com/docs/use-wallet/mobile/; }
    location ^~ /docs/wallet/keys-and-accounts { return 301 https://docs.zunialab.com/docs/use-wallet/keys/; }
    location ^~ /docs/wallet/fees { return 301 https://docs.zunialab.com/docs/use-wallet/networks/; }
    location ^~ /docs/wallet/custom-chains { return 301 https://docs.zunialab.com/docs/use-wallet/networks/; }
    location ^~ /docs/ibc/transfers { return 301 https://docs.zunialab.com/docs/use-wallet/send-and-ibc/; }
    location ^~ /docs/ibc/staking { return 301 https://docs.zunialab.com/docs/use-wallet/staking/; }
    location ^~ /docs/connect/sdk { return 301 https://docs.zunialab.com/docs/get-started/quickstart/; }
    location ^~ /docs/connect/dapp-api { return 301 https://docs.zunialab.com/docs/reference/provider/; }
    location ^~ /docs/connect/native-ws { return 301 https://docs.zunialab.com/docs/integrate/qr/; }
    location ^~ /docs/connect/walletconnect { return 301 https://docs.zunialab.com/docs/integrate/walletconnect/; }
    location ^~ /docs/connect/env-matrix { return 301 https://docs.zunialab.com/docs/get-started/compatibility/; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
